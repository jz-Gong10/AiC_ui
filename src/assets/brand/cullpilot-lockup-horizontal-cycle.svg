  </g>
  <g class="cp-c1">
    <path d="M7.6 9.8H24.4A0.9 0.9 0 0 1 25.3 10.7V21.3A0.9 0.9 0 0 1 24.4 22.2H7.6A0.9 0.9 0 0 1 6.7 21.3V10.7A0.9 0.9 0 0 1 7.6 9.8Z" fill="none" stroke="#5264CA" stroke-width="0.55"/>
    <path d="M8.25 10.8H23.75A0.55 0.55 0 0 1 24.3 11.35V20.65A0.55 0.55 0 0 1 23.75 21.2H8.25A0.55 0.55 0 0 1 7.7 20.65V11.35A0.55 0.55 0 0 1 8.25 10.8Z" fill="none" stroke="#5264CA" stroke-width="0.55"/>
  </g>
  <g class="cp-c2">
    <path d="M11.6 4.7H28.4A0.9 0.9 0 0 1 29.3 5.6V16.2A0.9 0.9 0 0 1 28.4 17.1H11.6A0.9 0.9 0 0 1 10.7 16.2V5.6A0.9 0.9 0 0 1 11.6 4.7Z" fill="#5264CA"/>
  </g>
</svg>
