    <path d="M3.6 14.9H20.4A0.9 0.9 0 0 1 21.3 15.8V26.4A0.9 0.9 0 0 1 20.4 27.3H3.6A0.9 0.9 0 0 1 2.7 26.4V15.8A0.9 0.9 0 0 1 3.6 14.9Z" fill="none" stroke="#5264CA" stroke-width="0.55" opacity="0.62"/>
