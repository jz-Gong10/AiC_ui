<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.9 3.9 86.33 24.2" width="400" height="112" role="img" aria-label="CullPilot 横向组合 · 展开收起循环">
  <!-- CullPilot 横向组合动画 · 循环版 v2（顶栏常驻 / 处理态用）
       一周 2880ms：展开 0–720 · 停 720–1420 · 收起 1420–2180 · 停 2180–2880
       动画只作用于图标（cp-c0/cp-c1/cp-c2），字标全程静止。
       浅底版：图标 #5264CA、字标 #1B1E25；深底版把这两组颜色换成 #8BAAFF / #F3F4F6 -->
  <style>
    .cp-c0,.cp-c1,.cp-c2{transform-box:fill-box}
    .cp-c2{transform-origin:50% 50%}
    .cp-c1{animation:cp-cycle-c1-t 2880ms infinite,cp-cycle-c1-o 2880ms infinite}
    .cp-c0{animation:cp-cycle-c0-t 2880ms infinite,cp-cycle-c0-o 2880ms infinite}
    .cp-c2{animation:cp-cycle-c2 2880ms infinite}
    @keyframes cp-cycle-c1-t{
      0%{transform:translate(4px,-5.1px);animation-timing-function:linear}
      2.78%{transform:translate(4px,-5.1px);animation-timing-function:cubic-bezier(.22,1.18,.36,1)}
      18.75%{transform:translate(0,0);animation-timing-function:linear}
      54.86%{transform:translate(0,0);animation-timing-function:cubic-bezier(.5,0,.75,.35)}
      69.44%{transform:translate(4px,-5.1px);animation-timing-function:linear}
      100%{transform:translate(4px,-5.1px)}
    }
    @keyframes cp-cycle-c1-o{
      0%,2.78%{opacity:0}
      6.25%{opacity:1}
      65.28%{opacity:1}
      69.44%,100%{opacity:0}
    }
    @keyframes cp-cycle-c0-t{
      0%{transform:translate(8px,-10.2px);animation-timing-function:linear}
      7.64%{transform:translate(8px,-10.2px);animation-timing-function:cubic-bezier(.22,1.18,.36,1)}
      25%{transform:translate(0,0);animation-timing-function:linear}
      49.31%{transform:translate(0,0);animation-timing-function:cubic-bezier(.5,0,.75,.35)}
      65.28%{transform:translate(8px,-10.2px);animation-timing-function:linear}
      100%{transform:translate(8px,-10.2px)}
    }
    @keyframes cp-cycle-c0-o{
      0%,7.64%{opacity:0}
      11.81%{opacity:1}
      61.11%{opacity:1}
      65.28%,100%{opacity:0}
    }
    @keyframes cp-cycle-c2{
      0%{transform:scale(1);animation-timing-function:linear}
      2.78%{transform:scale(1);animation-timing-function:ease-in-out}
      13.19%{transform:scale(1.045);animation-timing-function:ease-in-out}
      23.61%{transform:scale(1);animation-timing-function:linear}
      66.67%{transform:scale(1);animation-timing-function:ease-in-out}
      71.18%{transform:scale(.96);animation-timing-function:ease-in-out}
      75.69%{transform:scale(1);animation-timing-function:linear}
      100%{transform:scale(1)}
    }
  @media (prefers-reduced-motion:reduce){.cp-c0,.cp-c1,.cp-c2{animation:none!important;transform:none!important;opacity:1!important}}
  </style>
  <!-- 字标（转曲，静态，不参与动画） -->
